<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- CSP is tuned for the Entur endpoints + Esri tiles below. If you point CONFIG
     at a different journey-planner / geocoder host, or different map tiles, update
     connect-src / img-src to match, or the browser will silently block them. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://unpkg.com;
  style-src 'self' 'unsafe-inline' https://unpkg.com;
  img-src 'self' data: https://*.arcgisonline.com;
  connect-src 'self' https://api.entur.io;
  base-uri 'self';
  object-src 'none';
"/>
<!-- frame-ancestors omitted: it is ignored in a <meta> CSP (needs an HTTP header, which a
     static GitHub-Pages file can't set). Add it at the server/CDN layer for clickjacking cover. -->
<title>Connection Explorer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"/>
<style>
/* ============================================================================
   Connection Explorer — v1.x
   Pick a stop and a departure, then investigate the interchanges that meet it
   here and at walkable neighbours. Reads only what OTP serves (Entur Journey
   Planner v3 + Geocoder v3). Single self-contained file, no build step.
   ========================================================================== */

/* THEME tokens are injected from the JS THEME object (applyTheme). Only layout
   lives here; every colour comes from a var so a deployment can reskin via CONFIG. */
:root{ --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
       --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }  /* class rules (e.g. .icon-btn display:flex) otherwise beat the UA [hidden] rule */
html,body{ height:100%; }
body{ margin:0; background:var(--c-bg); color:var(--c-text); font-family:var(--ui); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
.app{ display:flex; flex-direction:column; height:100%; min-height:560px; }
button{ font-family:inherit; }
/* One visible keyboard-focus ring for every interactive element (there was none). */
:focus-visible{ outline:2px solid var(--c-accent); outline-offset:2px; }

/* command bar */
.bar{ background:var(--c-header); color:var(--c-header-text); display:flex; align-items:center; gap:14px; padding:6px 14px; min-height:56px; flex:none; flex-wrap:wrap; }
.brand{ display:flex; align-items:baseline; gap:8px; }
.brand h1{ font-size:16px; font-weight:700; margin:0; }
.brand h1 span{ color:var(--c-accent); }
.brand .ver{ font-family:var(--mono); font-size:10px; color:var(--c-header-muted); }
.target{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
.stopbox{ position:relative; min-width:230px; align-self:center; }
.stopbox input{ width:100%; background:var(--c-header-input); border:1px solid var(--c-header-line); color:var(--c-header-text); border-radius:8px; padding:8px 10px; font-size:13px; outline:none; font-family:var(--ui); }
.stopbox input:focus{ border-color:var(--c-accent); }
.span{ display:flex; align-items:flex-end; gap:7px; }
.vdiv{ width:1px; height:30px; background:var(--c-header-line); align-self:center; margin:0 3px; flex:none; }
.tval{ width:82px; } .dval{ width:138px; }
.field input[type="time"],.field input[type="date"]{ color-scheme:dark; }
.geo-list{ position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--c-card); border:1px solid var(--c-border); border-radius:9px; box-shadow:var(--shadow-lg); z-index:1200; overflow:hidden; max-height:320px; overflow-y:auto; }
.geo-list.hidden{ display:none; }
.geo-item{ padding:8px 11px; cursor:pointer; display:flex; flex-direction:column; gap:1px; border-bottom:1px solid var(--c-border); }
.geo-item:last-child{ border-bottom:none; }
.geo-item:hover,.geo-item.active{ background:var(--c-accent-soft); }
.geo-item .n{ color:var(--c-text); font-size:13px; }
.geo-item .m{ font-family:var(--mono); font-size:10.5px; color:var(--c-faint); }
.fields{ display:flex; gap:12px; align-items:flex-end; margin-left:auto; flex-wrap:wrap; }
.field{ display:flex; flex-direction:column; gap:2px; }
.field label{ font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--c-header-muted); }
.field input{ background:var(--c-header-input); border:1px solid var(--c-header-line); color:var(--c-header-text); border-radius:6px; padding:5px 7px; font-size:12px; font-family:var(--mono); outline:none; }
.field input:focus{ border-color:var(--c-accent); }
.field .mini{ width:58px; text-align:center; }
/* Drop the number spinners — they crowd the field, appear on hover, and clip the value. */
.field input[type="number"]{ -moz-appearance:textfield; }
.field input[type="number"]::-webkit-outer-spin-button,.field input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.tools{ display:flex; gap:6px; }
.icon-btn{ background:var(--c-header-input); border:1px solid var(--c-header-line); color:var(--c-header-text); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
.icon-btn:hover{ border-color:var(--c-accent); }
.icon-btn.lang{ width:auto; padding:0 10px; font-size:12px; font-weight:700; }

/* work area */
.work{ flex:1; display:flex; min-height:0; }
.col{ display:flex; flex-direction:column; min-height:0; background:var(--c-panel); border-right:1px solid var(--c-border); }
.col-dep{ width:266px; flex:none; }
.col-xf{ width:392px; flex:none; background:var(--c-panel-2); }
.col-head{ display:flex; align-items:center; gap:8px; height:41px; padding:0 14px; border-bottom:1px solid var(--c-border); background:var(--c-panel); flex:none; }
.col-head .ttl{ font-size:12px; text-transform:uppercase; letter-spacing:.6px; font-weight:700; margin:0; }
.col-head .sub{ font-family:var(--mono); font-size:11px; color:var(--c-faint); margin-left:auto; }
/* Left-panel tabs: the direction selector doubles as the header (the active tab names the board). */
.paneltabs{ display:flex; gap:4px; height:41px; padding:0 8px; border-bottom:1px solid var(--c-border); background:var(--c-panel); flex:none; }
.paneltabs button{ appearance:none; border:none; background:none; cursor:pointer; padding:0 8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--c-muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
.paneltabs button:hover{ color:var(--c-text); }
.paneltabs button.on{ color:var(--c-accent-text); border-bottom-color:var(--c-accent); }
.col-scroll{ overflow-y:auto; padding:11px; display:flex; flex-direction:column; gap:10px; }
.hint{ color:var(--c-muted); font-size:12.5px; text-align:center; padding:22px 12px; }
.hint.err{ color:var(--c-bad); }

/* mode line-tag: mode = ICON (neutral), colour reserved for alerts */
.linetag{ display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-weight:700; font-size:11.5px; color:var(--c-text); border:1px solid var(--c-border-strong); background:var(--c-card-2); border-radius:6px; padding:2px 7px; white-space:nowrap; }
.linetag svg{ width:14px; height:14px; flex:none; }
.linetag.noline{ color:var(--c-muted); font-weight:600; }

/* shared service-card grammar (board, interchange cards, detail legs)
   The TIME is the fixed anchor for the eye — same size in every box. */
.card-head{ display:flex; align-items:flex-start; gap:9px; }
.tblk{ display:flex; flex-direction:column; line-height:1.14; flex:none; }
.t-aim{ font-family:var(--mono); font-weight:700; font-size:15px; }
.t-live{ font-family:var(--mono); font-size:10px; color:var(--c-warn); }
.card-head .linetag,.card-head .dest{ margin-top:1px; }  /* nudge onto the aimed-time line */
.card-head .dest{ font-size:12.5px; color:var(--c-text); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rolenote{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--c-faint); white-space:nowrap; flex:none; align-self:flex-start; }
.rolelead{ font-weight:600; color:var(--c-text); }
.card-sub{ font-size:11px; color:var(--c-muted); margin-top:2px; }
.layover{ font-size:11px; color:var(--c-muted); margin-top:3px; display:flex; align-items:center; gap:4px; }
.layover b{ color:var(--c-text); font-weight:600; }

/* board (arrivals/departures) — a real <button> for keyboard/AT, reset to look like a card */
.dep{ display:block; width:100%; text-align:left; font:inherit; color:inherit; appearance:none; background:var(--c-card); border:1px solid var(--c-border); border-radius:9px; padding:8px 10px; cursor:pointer; }
.dep:hover{ border-color:var(--c-accent); }
.dep[aria-selected="true"]{ border-color:var(--c-accent); background:var(--c-accent-soft); box-shadow:inset 0 0 0 1px var(--c-accent); }
/* direction toggle: which end of the interchange to anchor on */
.dirseg{ display:flex; gap:4px; background:var(--c-card-2); border:1px solid var(--c-border); border-radius:8px; padding:3px; }
.dirseg button{ flex:1; border:none; background:transparent; color:var(--c-muted); border-radius:6px; padding:6px 6px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap; }
.dirseg button:hover{ color:var(--c-text); }
.dirseg button.on{ background:var(--c-card); color:var(--c-accent-text); box-shadow:var(--shadow); }
.filterbox{ display:flex; align-items:center; gap:8px; background:var(--c-card); border:1px solid var(--c-border-strong); border-radius:8px; padding:6px 9px; }
.filterbox input{ border:none; background:transparent; color:var(--c-text); font-size:12.5px; width:100%; outline:none; }
.filterbox input::placeholder{ color:var(--c-faint); }
.filterbox svg{ color:var(--c-faint); flex:none; }

/* tiles */
.tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.tile{ background:var(--c-card); border:1px solid var(--c-border); border-radius:9px; padding:8px 9px; position:relative; overflow:hidden; }
.tile .n{ font-size:19px; font-weight:750; font-family:var(--mono); line-height:1.1; }
.tile .l{ font-size:8.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--c-muted); margin-top:1px; }
.tile.ok .n{ color:var(--c-ok);} .tile.warn .n{ color:var(--c-warn);} .tile.miss .n{ color:var(--c-muted);} .tile.flag .n{ color:var(--c-flag);}
.tile::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
.tile.ok::before{ background:var(--c-ok);} .tile.warn::before{ background:var(--c-warn);} .tile.miss::before{ background:var(--c-muted);} .tile.flag::before{ background:var(--c-flag);}

/* chips */
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ border:1px solid var(--c-border-strong); background:var(--c-card); color:var(--c-text); border-radius:999px; padding:3px 10px 3px 8px; font-size:11.5px; cursor:pointer; display:flex; align-items:center; gap:5px; user-select:none; }
.chip svg{ width:14px; height:14px; }
.chip:hover{ border-color:var(--c-accent); }
.chip[aria-pressed="true"]{ background:var(--c-accent-soft); border-color:var(--c-accent); color:var(--c-accent-text); font-weight:600; }
.chip.ok[aria-pressed="true"]{ background:var(--c-ok-soft); border-color:var(--c-ok); color:var(--c-ok);}
.chip.warn[aria-pressed="true"]{ background:var(--c-warn-soft); border-color:var(--c-warn); color:var(--c-warn);}
.chip.miss[aria-pressed="true"]{ background:var(--c-card-2); border-color:var(--c-border-strong); color:var(--c-muted);}
/* Chips are ON by default (showing); an OFF chip means "hidden" and must read as
   clearly excluded — dim + strikethrough — even the grey Impossible chip whose on-colour is muted. */
.chip[aria-pressed="false"]{ opacity:.5; text-decoration:line-through; color:var(--c-faint); border-color:var(--c-border); background:var(--c-card); font-weight:400; }
.chip[aria-pressed="false"]:hover{ opacity:.75; border-color:var(--c-accent); }
.chip[aria-pressed="false"] svg{ opacity:.55; }
.flt-lbl{ font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--c-muted); font-weight:600; margin-bottom:5px; }

/* interchange cards — also a real <button>, reset to look like a card */
.xf{ display:block; width:100%; text-align:left; font:inherit; color:inherit; appearance:none; background:var(--c-card); border:1px solid var(--c-border); border-radius:10px; padding:9px 11px 9px 13px; position:relative; cursor:pointer; box-shadow:var(--shadow); }
.xf::before{ content:""; position:absolute; left:0; top:9px; bottom:9px; width:4px; border-radius:4px; }
.xf.ok::before{ background:var(--c-ok);} .xf.warn::before{ background:var(--c-warn);} .xf.miss::before{ background:var(--c-muted);}
.xf.guar::before{ background:var(--c-guar);}  /* confirmed guaranteed overrides the buffer stripe */
.xf.guarweak::before{ background:var(--c-warn);}  /* guaranteed but 0/missing wait — a caution, not a green light */
.flagpill.guarpill{ background:var(--c-guar-soft); border-color:var(--c-guar); color:var(--c-guar); }
.flagpill.guarpill.weak{ background:var(--c-warn-soft); border-color:var(--c-warn); color:var(--c-warn); }
.xf:hover{ border-color:var(--c-accent); }
.xf.miss{ background:var(--c-card-2); opacity:.72; }              /* missed = greyed, "in the past", not an error */
/* selected interchange gets the same red tint as the selected board item */
.xf[aria-selected="true"]{ border-color:var(--c-accent); background:var(--c-accent-soft); opacity:1; box-shadow:inset 0 0 0 1px var(--c-accent), var(--shadow); }
.xf-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; }
.pill{ font-size:10.5px; border-radius:999px; padding:3px 8px; display:inline-flex; align-items:center; gap:5px; border:1px solid var(--c-border-strong); color:var(--c-muted); background:var(--c-card-2); font-family:var(--mono); }
.pill .k{ font-family:var(--ui); font-size:9px; text-transform:uppercase; letter-spacing:.4px; color:var(--c-faint); }
.buf{ font-weight:700; } .buf.pos{ color:var(--c-ok);} .buf.tt{ color:var(--c-warn);} .buf.neg{ color:var(--c-muted);}
.flagpill{ background:var(--c-flag-soft); border-color:var(--c-flag); color:var(--c-flag); font-family:var(--ui); font-weight:600; }
.more{ border:1px dashed var(--c-border-strong); background:transparent; color:var(--c-accent-text); border-radius:9px; padding:9px; cursor:pointer; font-size:12.5px; font-weight:600; }
.more:hover{ background:var(--c-accent-soft); }

/* map */
.map-wrap{ flex:1; position:relative; min-width:0; }
#map{ position:absolute; inset:0; background:var(--c-map); }
.leaflet-container{ background:var(--c-map); font-family:var(--ui); }
.pin-ic{ display:flex; align-items:center; justify-content:center; background:var(--c-card); border:2px solid var(--c-node); color:var(--c-node); border-radius:50%; box-shadow:var(--shadow); }
.pin-ic svg{ flex:none; display:block; }
.pin-ic.anchor{ border-color:var(--c-accent); color:var(--c-accent); border-width:3px; }
.pin-ic.sel{ outline:3px solid var(--c-accent); outline-offset:2px; }
.map-note{ position:absolute; top:10px; left:10px; z-index:600; background:var(--c-card); border:1px solid var(--c-border); border-radius:8px; padding:6px 10px; font-size:11px; color:var(--c-muted); box-shadow:var(--shadow); max-width:260px; }
.map-note.hidden{ display:none; }
.legend{ position:absolute; bottom:12px; left:10px; z-index:600; background:var(--c-card); border:1px solid var(--c-border); border-radius:9px; padding:9px 11px; font-size:11px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:5px; }
.legend .row{ display:flex; align-items:center; gap:8px; }
.legend .sw{ width:20px; height:0; border-top:3px solid var(--c-walk); border-radius:2px; }
.legend .sw.cf{ border-top-style:dashed; border-color:var(--c-faint); }
.bg-ctl{ position:absolute; top:10px; right:10px; z-index:600; }
.bg-ctl select{ background:var(--c-card); color:var(--c-text); border:1px solid var(--c-border); border-radius:7px; padding:5px 8px; font-size:12px; }

/* detail overlay (step 3) */
.detail{ position:absolute; top:52px; right:10px; z-index:650; width:326px; max-width:calc(100% - 20px); background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; box-shadow:var(--shadow-lg); overflow:hidden; }
.detail.hidden{ display:none; }
.detail-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--c-panel); border-bottom:1px solid var(--c-border); }
.detail-head .ttl{ font-size:12px; text-transform:uppercase; letter-spacing:.6px; font-weight:700; }
.detail-head .x{ margin-left:auto; cursor:pointer; color:var(--c-muted); border:none; background:none; font-size:16px; }
.detail-body{ padding:12px; display:flex; flex-direction:column; gap:11px; max-height:calc(100vh - 160px); overflow-y:auto; }
.dleg{ background:var(--c-card-2); border:1px solid var(--c-border); border-radius:9px; padding:9px 11px; }
.dleg .card-sub{ margin-top:5px; }
.idrow{ font-family:var(--mono); font-size:10px; color:var(--c-faint); word-break:break-all; margin-top:2px; }
.idrow b{ color:var(--c-muted); font-weight:600; }
.walkrow{ display:flex; flex-direction:column; gap:5px; padding:8px 10px; background:var(--c-card-2); border:1px dashed var(--c-border-strong); border-radius:9px; font-size:12px; }
.walkrow .wr-main{ display:flex; align-items:center; gap:8px; }
.walkrow .r{ margin-left:auto; font-family:var(--mono); color:var(--c-muted); }
.wr-reach{ font-size:11px; color:var(--c-muted); }
.wr-reach b{ font-family:var(--mono); color:var(--c-text); font-weight:700; }
.tmin{ font-size:10.5px; color:var(--c-faint); text-align:center; padding:0 6px; }
.tmin b{ font-family:var(--mono); color:var(--c-muted); }
.walkrow.clash{ border-color:var(--c-warn); border-style:solid; }
.walkrow.clash .wr-reach, .walkrow.clash .wr-reach b{ color:var(--c-warn); }
.bufbig{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.bufbox{ border:1px solid var(--c-border); border-radius:9px; padding:8px 10px; text-align:center; }
.bufbox.secondary{ opacity:.7; }
.bufbox .k{ font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--c-faint); }
.bufbox .v{ font-family:var(--mono); font-weight:750; font-size:18px; margin-top:2px; }
.verdict{ font-size:11.5px; text-align:center; padding:7px; border-radius:8px; font-weight:600; }
.verdict.ok{ background:var(--c-ok-soft); color:var(--c-ok);} .verdict.warn{ background:var(--c-warn-soft); color:var(--c-warn);} .verdict.miss{ background:var(--c-card-2); color:var(--c-muted);} .verdict.flag{ background:var(--c-flag-soft); color:var(--c-flag);}
.verdict.guar{ background:var(--c-guar-soft); color:var(--c-guar);} .verdict.checking{ background:var(--c-card-2); color:var(--c-muted); font-weight:500;}

/* overlay spinner */
.busy{ position:absolute; inset:0; background:var(--c-scrim); display:none; align-items:center; justify-content:center; z-index:700; }
.busy.on{ display:flex; }
.busy .card{ background:var(--c-card); border:1px solid var(--c-border); border-radius:10px; padding:16px 22px; font-size:13px; color:var(--c-text); box-shadow:var(--shadow-lg); }

@media (max-width:1000px){ .work{ flex-wrap:wrap; } .col-dep{ width:42%; } .col-xf{ width:58%; } .map-wrap{ flex-basis:100%; min-height:360px; order:3; } .detail{ top:10px; } }
@media (max-width:760px){ .fields{ margin-left:0; } .target,.fields{ flex:1 1 100%; } .stopbox{ flex:1 1 200px; min-width:160px; } }
@media (max-width:620px){ .col-dep,.col-xf{ width:100%; max-height:42vh; } }
</style>
</head>
<body>

<!-- monochrome mode icons, referenced via <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ic-metro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="5" y="10.7" width="14" height="2.6" fill="currentColor"/></symbol>
  <symbol id="ic-tram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="5" width="12" height="11" rx="2.5"/><path d="M12 5V2.5"/><path d="M8.5 20l2-4M15.5 20l-2-4"/><path d="M9 9.5h6"/></symbol>
  <symbol id="ic-bus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="10.5" rx="2.5"/><path d="M3.5 11h17"/><circle cx="8" cy="18.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="18.5" r="1.5" fill="currentColor" stroke="none"/></symbol>

  guaranteed: { bandMin:20, searchWindow:20 },
  // boardCap/partnerCap = numberOfDepartures ceilings; walkFailWarn = show a "verdicts

  limits:   { nearbyStops:40, walkQueries:120, renderCap:200, walkConcurrency:6, boardCap:250, partnerCap:150, walkFailWarn:0.3 },

/* Entur brand palette (linje.entur.no). Semantic green/amber are harmonised here

/* ============================ i18n ======================================== */
const STRINGS = {
  en: { 'f.from':'From','f.to':'To','f.date':'Date','f.walk':'Walk min','f.wait':'Wait min',
        'c.interchanges':'Connections',
        'hint.pickstop':'Search and pick a stop place to list its services.',

        'x.mode':'Mode','x.connection':'Connection','x.none':'Nothing meets this service in the window.',
        'x.waitquay':'Wait at quay','nav.arr':'Arrivals','nav.dep':'Departures',
        'x.sort':'Sort','x.sortchrono':'Chronological','x.sortbuffer':'Buffer',
        'd.detail':'Connection detail' },
  no: { 'f.from':'Fra','f.to':'Til','f.date':'Dato','f.walk':'Gange min','f.wait':'Vente min',
        'c.interchanges':'Forbindelser',
        'hint.pickstop':'Søk og velg et stoppested for å liste tjenestene.',
        'hint.pickdep':'Velg en tjeneste for å se byttene som møter den her.',
        'lg.walk':'gangvei','lg.cf':'luftlinje (når gangveien er mistenkelig)',
        'x.feasible':'Mulig','x.tight':'Bommet','x.missed':'Umulig','x.flagged':'Flagget',
        'x.mode':'Modus','x.connection':'Forbindelse','x.none':'Ingenting møter denne tjenesten i vinduet.',
        'x.waitquay':'Vent på plattform','nav.arr':'Ankomster','nav.dep':'Avganger',
        'x.sort':'Sortér','x.sortchrono':'Kronologisk','x.sortbuffer':'Buffer',
        'd.detail':'Forbindelsesdetaljer' },
};
// Forced to English while the language toggle is hidden (NO translation isn't up to scratch
// yet). To restore: bring back the locale/localStorage detection below and un-hide #lang.
let LANG = 'en';
// let LANG = (localStorage.getItem('ie-lang')==='no'||localStorage.getItem('ie-lang')==='en')
//   ? localStorage.getItem('ie-lang') : ((navigator.language||'').startsWith('no')?'no':'en');
function t(k){ return (STRINGS[LANG]&&STRINGS[LANG][k])||STRINGS.en[k]||k; }
function applyI18n(){ document.querySelectorAll('[data-i18n]').forEach(function(el){
  const k=el.getAttribute('data-i18n'); if(el.placeholder!==undefined&&el.tagName==='INPUT') el.placeholder=t(k); else el.textContent=t(k); }); }

/* ============================ util ======================================== */
const $=function(id){ return document.getElementById(id); };
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }
function debounce(fn,ms){ let h; return function(){ const a=arguments,c=this; clearTimeout(h); h=setTimeout(function(){ fn.apply(c,a); },ms); }; }
const MODES={ metro:'metro',tram:'tram',bus:'bus',rail:'rail',water:'water',ferry:'water',coach:'bus',trolleybus:'bus',funicular:'rail',cableway:'other',air:'other',taxi:'other',lift:'other' };
function modeIcon(m){ return MODES[(m||'').toLowerCase()]||'other'; }
function tagHtml(mode,label,cls){ const ic=modeIcon(mode);
  return '<span class="linetag '+(cls||'')+(label?'':' noline')+'"><svg><use href="#ic-'+ic+'"/></svg>'+esc(label|| (mode||'?'))+'</span>'; }
// The shared card grammar used by every box: aimed time (live under) · line tag ·
// destination, then "StopPlace name · Quay X · with Authority" on one sub-line.
function timeBlock(aimIso, liveIso, hasRt){ const show=!!(hasRt&&liveIso);
  // aimed time on top (level with the tag/destination), live time under it.
  // Show the live line whenever the call HAS real-time data — even when it equals the
  // planned time — because its presence tells the user the service is tracked live.
  return '<span class="tblk"><span class="t-aim">'+clock(aimIso)+'</span>'+(show?'<span class="t-live">'+clock(liveIso)+'</span>':'')+'</span>'; }
function svcHead(svc, aimIso, liveIso, stopName, roleNote, subRole, layover){
  // one sub-line: [<role> at] [neighbour stop name ·] Quay X · with Authority
  // roleNote sits top-right on the head (cards); subRole leads the sub-line as
  // "<verb> at <place>" (detail legs) — never both at once. layover is a board-only
  // note for a dwelling vehicle (the opposite time), e.g. "departs 17:12".
  const parts=[];
  if(stopName) parts.push(esc(stopName));
  if(svc.quayPub) parts.push('Quay '+esc(svc.quayPub));
  if(svc.authority) parts.push('with '+esc(svc.authority));
  const sub = subRole ? '<span class="rolelead">'+esc(subRole)+'</span> at '+parts.join(' · ') : parts.join(' · ');
  return '<div class="card-head">'+timeBlock(aimIso,liveIso,svc.rt)+tagHtml(svc.mode,svc.lineNo)
    +'<span class="dest">'+esc(svc.dest||svc.lineName||'')+'</span>'
    +(roleNote?'<span class="rolenote">'+roleNote+'</span>':'')+'</div>'
    +((parts.length||subRole)?'<div class="card-sub">'+sub+'</div>':'')
    +(layover?'<div class="layover">⏱ '+layover+'</div>':''); }  /* layover is caller-built from clock() — trusted */
function pad(n){ return String(n).padStart(2,'0'); }
function isoOffset(d){ const off=-d.getTimezoneOffset(),sg=off>=0?'+':'-';
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+sg+pad(Math.floor(Math.abs(off)/60))+':'+pad(Math.abs(off)%60); }
function clock(iso){ if(!iso) return '--:--'; const d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function clockS(iso){ const d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function signed(sec){ if(sec==null||isNaN(sec)) return '–'; const s=Math.round(sec),a=Math.abs(s),m=Math.floor(a/60),ss=a%60;
  return (s<0?'−':'+')+m+':'+pad(ss); }
// Human-readable duration: "8 minutes 6 seconds", "1 minute 44 seconds", "44 seconds", "1 hour 3 minutes".
function humanDur(sec){ sec=Math.max(0,Math.round(sec||0)); const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60; const p=[];
  if(h) p.push(h+(h===1?' hour':' hours'));
  if(m) p.push(m+(m===1?' minute':' minutes'));
  if(s||!p.length) p.push(s+(s===1?' second':' seconds'));
  return p.join(' '); }
function mmss(sec){ const a=Math.abs(Math.round(sec)); return Math.floor(a/60)+':'+pad(a%60); }
function haversine(a,b,c,d){ const R=6371000,r=Math.PI/180,dLat=(c-a)*r,dLon=(d-b)*r,
  x=Math.sin(dLat/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function decodePolyline(str){ if(!str) return []; let i=0,lat=0,lng=0; const out=[];
  while(i<str.length){ let b,sh=0,res=0; do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    lat+=(res&1)?~(res>>1):(res>>1); sh=0; res=0; do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    lng+=(res&1)?~(res>>1):(res>>1); out.push([lat/1e5,lng/1e5]); } return out; }
async function runPool(items,worker,concurrency){ const res=[]; let idx=0;
  async function next(){ const i=idx++; if(i>=items.length) return; res[i]=await worker(items[i],i); return next(); }
  await Promise.all(Array.from({length:Math.min(concurrency,items.length)},next)); return res; }

/* ============================ api ========================================= */
async function jp(query,variables,signal){
  const r=await fetch(CONFIG.endpoints.journeyPlanner,{ method:'POST',
    headers:{'Content-Type':'application/json','ET-Client-Name':CONFIG.clientName},
    body:JSON.stringify({query:query,variables:variables||{}}), signal:signal });
  if(!r.ok) throw new Error('Journey planner HTTP '+r.status);
  const j=await r.json();
  // Keep partial data when present — a batched (aliased) query can return valid data
  // alongside a per-alias error, and one bad neighbour shouldn't wipe the whole batch.
  if(!j.data && j.errors && j.errors.length) throw new Error(j.errors[0].message||'GraphQL error');
  return j.data;
}
async function geoAutocomplete(q,signal){
  const u=CONFIG.endpoints.geocoder+'/autocomplete?limit=8&lang='+LANG+'&layers=stopPlace&q='+encodeURIComponent(q);
  const r=await fetch(u,{ headers:{'ET-Client-Name':CONFIG.clientName}, signal:signal });
  if(!r.ok) throw new Error('Geocoder HTTP '+r.status);
  const j=await r.json(); return (j.features||[]).map(function(f){ const p=f.properties||{};
    return { id:p.id, name:(p.names&&(p.names.display||p.names.default))||p.id,
             locality:(p.address&&p.address.locality)||'', coord:f.geometry&&f.geometry.coordinates,
             modes:(p.transportModes||[]).map(function(m){return m.mode;}) }; }); }

// One call selection, reused for the board and the partner batch. Requests BOTH
// arrival and departure times so the same query serves either direction — the
// anchor side reads arrival (outgoing) or departure (incoming) as needed.
const EC_FIELDS =
 ' aimedArrivalTime expectedArrivalTime aimedDepartureTime expectedDepartureTime realtime destinationDisplay{ frontText }'+
 ' quay{ id publicCode latitude longitude stopPlace{ id name } } serviceJourney{ id line{ id publicCode name transportMode authority{ id name } } }';

// ad = 'arrivals' | 'departures' — which side to list.
function boardQuery(ad){
  return 'query($id:String!,$start:DateTime!,$range:Int!){ stopPlace(id:$id){ id name latitude longitude'+
    ' quays{ id publicCode latitude longitude }'+
    ' estimatedCalls(startTime:$start,timeRange:$range,numberOfDepartures:'+CONFIG.limits.boardCap+',arrivalDeparture:'+ad+',includeCancelledTrips:false){'+
    EC_FIELDS+' } } }';
}
const Q_NEARBY =
 'query($lat:Float!,$lon:Float!,$r:Float!){ quaysByRadius(latitude:$lat,longitude:$lon,radius:$r,first:250){ edges{ node{ distance'+
 ' quay{ id publicCode latitude longitude stopPlace{ id name } } } } } }';

// Aliased stopPlace(...) batch of the OTHER side. Returns {query, vars} with each stop id
// passed as a GraphQL variable ($s0id …) rather than interpolated into the query literal.
function partnerQuery(stopIds, ad){
  const decl=stopIds.map(function(id,i){ return '$s'+i+'id:String!'; }).join(',');
  const frag=function(i){ return 's'+i+':stopPlace(id:$s'+i+'id){ id name'+
    ' estimatedCalls(startTime:$start,timeRange:$range,numberOfDepartures:'+CONFIG.limits.partnerCap+',arrivalDeparture:'+ad+',includeCancelledTrips:false){'+
    EC_FIELDS+' } }'; };
  const vars={}; stopIds.forEach(function(id,i){ vars['s'+i+'id']=id; });
  return { query:'query($start:DateTime!,$range:Int!'+(decl?','+decl:'')+'){ '+stopIds.map(function(id,i){return frag(i);}).join(' ')+' }', vars:vars };
}
const Q_WALK =
 'query($from:String!,$to:String!){ trip(from:{place:$from},to:{place:$to},modes:{directMode:foot,transportModes:[]},'+
 'numTripPatterns:1,walkSpeed:'+CONFIG.defaults.walkSpeed+'){ tripPatterns{ duration streetDistance legs{ pointsOnLink{ points } } } } }';

/* ============================ map ========================================= */
const ESRI='https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/';
const ESRI_ATTR='Esri, HERE, Garmin, OpenStreetMap contributors';
const BG={
  'Grey': { light:[ESRI+'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',ESRI+'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}'],
            dark:[ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}'] },
};
function createMap(){
  const map=L.map('map',{ zoomControl:true }).setView([59.91,10.75],13);
  let layer=null;
  function setVariant(dark){ if(layer) map.removeLayer(layer); layer=L.layerGroup();
    BG.Grey[dark?'dark':'light'].forEach(function(u,i){ L.tileLayer(u,{maxNativeZoom:16,maxZoom:19,attribution:i===0?ESRI_ATTR:undefined}).addTo(layer); });
    layer.addTo(map); }
  // Leaflet needs the container's final size; it is 0×0 until layout settles.
  setTimeout(function(){ map.invalidateSize(); },0);
  window.addEventListener('resize',function(){ map.invalidateSize(); });
  return { map:map, setVariant:setVariant };
}

/* ============================ detour curve ================================ */
/* Ratio breaks at small distances (two metro quays 15 m apart, 70 m walk to a
   crossing = ratio 4.7, but normal). So flag on how far the walk exceeds a
   distance-aware allowance, with zero weight below the crossing floor. */
function detour(euclidM,walkM){
  const d=CONFIG.detour, excess=walkM-euclidM;
  if(euclidM<d.minEuclid) return { conf:0, excess:excess, ratio:walkM/Math.max(1,euclidM) };
  const expected=euclidM+d.crossingAllowance+d.slope*euclidM;
  const over=walkM-expected;
  const conf=over<=0?0:Math.min(1,over/d.excessFull);
  return { conf:conf, excess:excess, ratio:walkM/euclidM };
}

/* ============================ state ======================================= */
// dir 'out' = anchor on an ARRIVING service, list OUTGOING departures you can
// catch (the passenger view, default). dir 'in' = anchor on a DEPARTURE, list
// the INCOMING arrivals that feed it (the planner view). Same pairs, opposite
// vantage — an interchange is symmetric.
const state={ stop:null, dir:(localStorage.getItem('ie-dir')==='in'?'in':'out'),
  calls:[], selAnchor:null, interchanges:[], selXf:null,
  boardHidden:new Set(), modeHidden:new Set(), connHidden:new Set(), lineQ:'', xfSort:(localStorage.getItem('ie-xfsort')==='buffer'?'buffer':'chrono'),
  renderN:CONFIG.limits.renderCap, walkCache:new Map(),
  mainAbort:null, mainToken:0, boardTruncated:false, partnerTruncated:false, walkFailRatio:0, _fitAnchor:null };
let mapApi=null, dark=false;
// Cancel any in-flight board/connection load and open a fresh generation. A superseded run
// bails when state.mainToken has moved on; the signal aborts its outstanding fetches so the
// old (e.g. up to 120 walk-trip) requests stop wasting the strict `trip` quota.
function beginMain(){ if(state.mainAbort) state.mainAbort.abort(); state.mainAbort=new AbortController();
  return { signal:state.mainAbort.signal, token:++state.mainToken }; }
function superseded(req){ return req.token!==state.mainToken; }
function isAbort(e){ return e && (e.name==='AbortError'||e.message==='The user aborted a request.'); }
// Per-direction wiring, so the flow code stays direction-agnostic.
function DIR(){ return state.dir==='in'
  ? { anchorAD:'departures', partnerAD:'arrivals', anchorTime:'dep', partnerTime:'arr', boardTitle:'Departures', partnerBack:true }
  : { anchorAD:'arrivals', partnerAD:'departures', anchorTime:'arr', partnerTime:'dep', boardTitle:'Arrivals', partnerBack:false }; }

/* ---------------------------------------------------------------- reference time */
// The board is a time-of-day span WITHIN one date — the date is the wall, never crossed.
// Returns {start, range(sec)} from the From/Date/To inputs, clamped so To ≥ From, same day.
function queryWindow(){
  const date=$('qDate').value, from=$('qFrom').value||'00:00', to=$('qTo').value||'23:59';
  let start=new Date(date+'T'+from+':00'); if(isNaN(start)){ start=new Date(); start.setSeconds(0,0); }
  let end=new Date((date||start.toISOString().slice(0,10))+'T'+to+':00');
  if(isNaN(end)||end<=start) end=new Date(start.getTime()+60000);  // guarantee a positive span
  return { start:start, range:Math.round((end-start)/1000) };
}
function initQuery(){ const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  const fm=Math.max(0,mins-5), tm=Math.min(23*60+59,mins+30);  // default: −5 min … +30 min, today
  $('qDate').value=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  $('qFrom').value=pad(Math.floor(fm/60))+':'+pad(fm%60);
  $('qTo').value=pad(Math.floor(tm/60))+':'+pad(tm%60); }

/* ============================ step 1: board ============================== */
function mapCall(c){ const sj=c.serviceJourney||{},ln=sj.line||{},q=c.quay||{},sp=q.stopPlace||{};
  return { arr:c.aimedArrivalTime, arrExp:c.expectedArrivalTime, dep:c.aimedDepartureTime, depExp:c.expectedDepartureTime,
    rt:c.realtime, dest:(c.destinationDisplay||{}).frontText||'', quayId:q.id, quayPub:q.publicCode, lat:q.latitude, lon:q.longitude,
    stopId:sp.id, stopName:sp.name,  // from the call itself — a fallback when quayMeta can't resolve it (parent-aggregated quays)
    sjId:sj.id, lineId:ln.id, lineNo:ln.publicCode, lineName:ln.name, mode:ln.transportMode, authority:(ln.authority||{}).name }; }
function anchorTimeIso(c){ return DIR().anchorTime==='arr'?c.arr:c.dep; }
function anchorExpIso(c){ return DIR().anchorTime==='arr'?c.arrExp:c.depExp; }
function partnerTimeIso(c){ return DIR().partnerTime==='arr'?c.arr:c.dep; }
function partnerExpIso(c){ return DIR().partnerTime==='arr'?c.arrExp:c.depExp; }

async function loadStop(stop){
  const req=beginMain();
  state.stop=stop; state.selAnchor=null; state.interchanges=[]; state.selXf=null; state.boardHidden.clear();
  state.walkCache.clear(); state._fitAnchor=null;  // pairs are keyed globally, but bound memory to the current stop
  $('xfScroll').innerHTML='<div class="hint">'+t('hint.pickdep')+'</div>';
  $('xfCount').textContent=''; hideDetail();
  const d=DIR();
  const win=queryWindow(); const start=win.start, range=win.range;  // span shown by the From/To pickers themselves
  busy(true,'Loading '+d.boardTitle.toLowerCase()+'…');
  try{
    const data=await jp(boardQuery(d.anchorAD),{ id:stop.id, start:isoOffset(start), range:range }, req.signal);
    if(superseded(req)) return;
    const sp=data&&data.stopPlace; if(!sp) throw new Error('Stop not found');
    state.stop.coord=(sp.latitude!=null&&sp.longitude!=null)?[sp.latitude,sp.longitude]:null;
    state.stop.quays=sp.quays||[]; state.stop.name=sp.name;
    const ec=sp.estimatedCalls||[];
    state.boardTruncated = ec.length>=CONFIG.limits.boardCap;   // hit the numberOfDepartures ceiling
    state.calls=ec.map(mapCall).filter(function(c){ return anchorTimeIso(c); });
    renderBoard();
    if(state.stop.coord) focusMap([state.stop.coord]);
  }catch(e){ if(isAbort(e)||superseded(req)) return;
    $('depScroll').innerHTML='<div class="hint err">'+esc(e.message)+'</div>'; }
  finally{ if(!superseded(req)) busy(false); }
}
function paintDirTabs(){ document.querySelectorAll('#dirTabs button').forEach(function(b){ const on=b.dataset.d===state.dir; b.classList.toggle('on',on); b.setAttribute('aria-selected',on?'true':'false'); }); }
function switchDir(dir){ if(dir===state.dir) return; state.dir=dir; localStorage.setItem('ie-dir',dir); paintDirTabs();
  state.selAnchor=null; state.interchanges=[]; state.selXf=null; hideDetail();
  $('xfScroll').innerHTML='<div class="hint">'+t('hint.pickdep')+'</div>'; $('xfCount').textContent='';
  if(state.stop) loadStop(state.stop); }
// To must not precede From — clamp the span whenever an input changes.
function validateSpan(){ if($('qTo').value && $('qFrom').value && $('qTo').value < $('qFrom').value) $('qTo').value=$('qFrom').value; }
// Push the To time later (clamped to end-of-day) — "look a bit further ahead".
function bumpTo(mins){ const parts=($('qTo').value||'00:00').split(':'); let tot=Math.min(23*60+59,(+parts[0])*60+(+parts[1])+mins);
  $('qTo').value=pad(Math.floor(tot/60))+':'+pad(tot%60); if(state.stop) loadStop(state.stop); }
function widenWindow(){ bumpTo(30); }
// One click to the next service on very sparse stops: extend To to end of day (never past it).
function restOfToday(){ $('qTo').value='23:59'; if(state.stop) loadStop(state.stop); }

function renderBoard(){
  const d=DIR(); const box=$('depScroll'); const q=(box.__q||'');
  const modesPresent=Array.from(new Set(state.calls.map(function(c){return modeIcon(c.mode);})));
  const list=state.calls.filter(function(c){
    if(state.boardHidden.has(modeIcon(c.mode))) return false;
    if(q){ const s=(c.lineNo+' '+c.lineName+' '+c.dest).toLowerCase(); if(s.indexOf(q)===-1) return false; }
    return true; })
    // Chronological (earliest first) by the AIMED time shown BIG on each card, real-time only
    // breaking ties — so the prominent times read in order. (Any app-side sort also overrides
    // OTP's raw dwell/departure order, which reads jumbled against the arrival times shown.)
    .sort(function(a,b){ return (new Date(anchorTimeIso(a))-new Date(anchorTimeIso(b)))
      || (new Date(anchorExpIso(a)||anchorTimeIso(a))-new Date(anchorExpIso(b)||anchorTimeIso(b))); });
  // Basic filters first (mode chips, then text) — consistent with the right panel.
  let html='<div class="chips" id="boardModeChips">'
    +modesPresent.map(function(m){ return '<button class="chip" data-mode="'+m+'" aria-label="Show '+esc(m)+' services"'+(state.boardHidden.has(m)?' aria-pressed="false"':' aria-pressed="true"')+'><svg><use href="#ic-'+m+'"/></svg>'+m+'</button>'; }).join('')+'</div>';
  html+='<div class="filterbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
    +'<input id="depFilter" aria-label="Filter services by line or destination" placeholder="line or destination…" value="'+attr(q)+'"/></div>';
  if(state.stop && !state.stop.coord)
    html+='<div class="hint err" style="padding:10px 12px 0">This stop has no coordinate, so walkable connections can’t be computed.</div>';
  if(state.boardTruncated)
    html+='<div class="hint" style="padding:8px 12px 0;font-size:11px">Showing the first '+CONFIG.limits.boardCap+' — narrow the time span to see the rest.</div>';
  if(!list.length){
    // Distinguish "the query found nothing" (offer to widen) from "filtered to nothing".
    if(state.calls.length===0)
      html+='<div class="hint">Nothing in the window.'
        +'<div style="display:flex;gap:8px;margin-top:10px;justify-content:center">'
        +'<button class="more" id="widenBtn">↔ +30 min</button>'
        +'<button class="more" id="todayBtn">↦ Rest of day</button></div></div>';
    else
      html+='<div class="hint">No matches — clear the mode/text filters above.</div>';
  }
  list.forEach(function(c){
    // Board is always the selected stop, so no StopPlace name (null) — just the platform.
    // Layover: if the vehicle dwells here (the opposite time differs by ≥1 min), show it.
    // Outgoing shows arrival → note the later departure; Incoming shows departure → note the earlier arrival.
    const other=d.anchorTime==='arr'?c.dep:c.arr;
    let lay=null;
    if(other&&anchorTimeIso(c)&&Math.abs(new Date(other)-new Date(anchorTimeIso(c)))>=CONFIG.board.layoverSec*1000)
      lay=(d.anchorTime==='arr'?'departs ':'arrived ')+'<b>'+clock(other)+'</b>';
    html+='<button type="button" class="dep" data-i="'+state.calls.indexOf(c)+'"'+(state.selAnchor===c?' aria-selected="true"':'')+'>'
      +svcHead(c, anchorTimeIso(c), anchorExpIso(c), null, null, null, lay)+'</button>';
  });
  box.innerHTML=html;
  if($('widenBtn')) $('widenBtn').addEventListener('click',widenWindow);
  if($('todayBtn')) $('todayBtn').addEventListener('click',restOfToday);
  $('boardModeChips').addEventListener('click',function(e){ const c=e.target.closest('.chip'); if(!c)return; const m=c.dataset.mode;
    state.boardHidden.has(m)?state.boardHidden.delete(m):state.boardHidden.add(m); renderBoard(); });
  const f=$('depFilter'); f.addEventListener('input',debounce(function(){ box.__q=f.value.toLowerCase(); const p=f.selectionStart; renderBoard(); const nf=$('depFilter'); nf.focus(); try{nf.setSelectionRange(p,p);}catch(_){} },180));
  box.querySelectorAll('.dep').forEach(function(el){ el.addEventListener('click',function(){ selectAnchor(state.calls[+el.dataset.i]); }); });
}

/* ============================ step 2: interchanges ======================== */
// Direction-agnostic. The anchor is one side of the pair (an arrival for 'out',
// a departure for 'in'); partners are the other side. Walk is always ARRIVAL
// quay → DEPARTURE quay; buffer is always departure − arrival − walk.
async function selectAnchor(anchor){
  state.selAnchor=anchor; state.selXf=null; state.renderN=CONFIG.limits.renderCap; hideDetail();
  document.querySelectorAll('.dep').forEach(function(el){ el.setAttribute('aria-selected', state.calls[+el.dataset.i]===anchor?'true':'false'); });
  if(!state.stop.coord){ $('xfScroll').innerHTML='<div class="hint err">This stop has no coordinate, so connections can’t be computed.</div>'; return; }
  const req=beginMain();
  const d=DIR(); const partnerIsDep=(d.partnerTime==='dep');
  busy(true,'Finding interchanges…');
  try{
    const anchorT=new Date(anchorTimeIso(anchor)).getTime();
    const anchorExp=anchorExpIso(anchor)?new Date(anchorExpIso(anchor)).getTime():null;
    const anchorQuay=(state.stop.quays||[]).find(function(q){return q.id===anchor.quayId;})||{ id:anchor.quayId, latitude:state.stop.coord[0], longitude:state.stop.coord[1] };
    // neighbourhood by radius (crow-flies; padded walk reach)
    const radius=Math.round((+$('wWalk').value||5)*60*CONFIG.defaults.walkSpeed*CONFIG.defaults.radiusPad);
    const near=await jp(Q_NEARBY,{ lat:state.stop.coord[0], lon:state.stop.coord[1], r:radius }, req.signal);
    if(superseded(req)) return;
    const quayMeta=new Map();
    // The selected stop's own quays. quaysByRadius reports these under the CHILD
    // stopplace ids of a multimodal parent — but their calls are already aggregated
    // into stops[0] (the parent), so counting them as neighbours only burns slots in
    // the nearbyStops cap (a dense hub has ~10 children, which was hiding Oslo S from
    // Jernbanetorget) and re-introduces the duplicates the sjId@quay@time dedup fixes.
    const parentQuays=new Set();
    (state.stop.quays||[]).forEach(function(q){ parentQuays.add(q.id); quayMeta.set(q.id,{lat:q.latitude,lon:q.longitude,pub:q.publicCode,stopId:state.stop.id,stopName:state.stop.name}); });
    const stopDist=new Map();  // neighbour stopId -> metres to its nearest quay
    (near.quaysByRadius.edges||[]).forEach(function(e){ const q=e.node.quay,sp=q.stopPlace||{};
      if(parentQuays.has(q.id)) return;  // the selected stop's own quay — already covered by stops[0]
      quayMeta.set(q.id,{lat:q.latitude,lon:q.longitude,pub:q.publicCode,stopId:sp.id,stopName:sp.name});
      if(sp.id && sp.id!==state.stop.id){ const dm=e.node.distance; if(!stopDist.has(sp.id)||dm<stopDist.get(sp.id)) stopDist.set(sp.id,dm); } });
    // anchor first, then the nearest neighbour stations (by their closest quay) up to the cap
    const stops=[state.stop.id].concat(
      Array.from(stopDist.keys()).sort(function(a,b){ return stopDist.get(a)-stopDist.get(b); }).slice(0,CONFIG.limits.nearbyStops));
    // partner calls across the neighbourhood, windowed relative to the anchor
    // ('out': departures AFTER the anchor arrives; 'in': arrivals BEFORE it departs).
    // The window must cover the FULL candidate horizon — a partner up to maxWait away plus
    // the time to walk the max reach — or a valid connection just past it is never even
    // fetched. (This hid a ferry leaving 13 min after a bus arrived at Veiesund kai, when the
    // window was a flat 12 min < the 15-min maxWait the filter allows.) Derived from the same
    // limits the candidate filter below uses, so query and filter can't disagree.
    const maxWait=(+$('wWait').value||CONFIG.connect.maxWaitMin)*60, maxReach=(+$('wWalk').value||5)*60*CONFIG.defaults.walkSpeed*CONFIG.defaults.reachPad;
    const W=Math.ceil(maxWait + maxReach/CONFIG.defaults.walkSpeed);
    const pStart=d.partnerBack?new Date(anchorT-W*1000):new Date(anchorT);
    const pq=partnerQuery(stops,d.partnerAD);
    const adata=await jp(pq.query, Object.assign({ start:isoOffset(pStart), range:W }, pq.vars), req.signal);
    if(superseded(req)) return;
    let partners=[]; const seen=new Set(); let partnerTrunc=false;
    stops.forEach(function(id,i){ const sp=adata&&adata['s'+i]; if(!sp) return;
      const ecs=sp.estimatedCalls||[]; if(ecs.length>=CONFIG.limits.partnerCap) partnerTrunc=true;
      ecs.forEach(function(c){ const call=mapCall(c); const qm=quayMeta.get(call.quayId)||{};
        call.lat=call.lat||qm.lat; call.lon=call.lon||qm.lon; call.quayPub=call.quayPub||qm.pub;
        call.stopId=qm.stopId||call.stopId; call.stopName=qm.stopName||call.stopName;  // radius-resolved first, else the call's own stopPlace
        // dedupe (a multimodal parent aggregates its children's calls) — only when we have an
        // identifying field, so two id-less calls at the same time aren't collapsed into one.
        const pt=partnerTimeIso(call); const idPart=(call.sjId||call.quayId);
        const ck=(call.sjId||'')+'@'+(call.quayId||'')+'@'+(pt||'');
        if(idPart){ if(seen.has(ck)) return; seen.add(ck); }
        partners.push(call); }); });
    state.partnerTruncated=partnerTrunc;
    // candidate filter: departure ≥ arrival, different service, within reach (maxWait/maxReach above)
    let cand=partners.filter(function(p){ const ptIso=partnerTimeIso(p); if(!ptIso||!p.lat) return false; if(p.sjId===anchor.sjId) return false;
      const pt=new Date(ptIso).getTime(); const depT=partnerIsDep?pt:anchorT, arrT=partnerIsDep?anchorT:pt;
      if(depT<arrT) return false; if((depT-arrT)/1000>maxWait+maxReach/CONFIG.defaults.walkSpeed) return false;
      p._euclid=haversine(anchorQuay.latitude,anchorQuay.longitude,p.lat,p.lon); return p._euclid<=maxReach; });
    // walk is ARRIVAL quay → DEPARTURE quay ('out': anchor→partner; 'in': partner→anchor)
    const walkPair=function(p){ return partnerIsDep?{from:anchorQuay.id,to:p.quayId}:{from:p.quayId,to:anchorQuay.id}; };
    const pairs=Array.from(new Set(cand.map(function(p){ const wp=walkPair(p); return wp.from+'>'+wp.to; })));
    let wFetched=0, wFail=0;
    await runPool(pairs.slice(0,CONFIG.limits.walkQueries), async function(key){
      if(superseded(req)||state.walkCache.has(key)) return; const parts=key.split('>'), from=parts[0], to=parts[1];
      if(from===to){ state.walkCache.set(key,{ dur:0, dist:0, pts:null }); return; }  // same quay = no walk (self-route 400s)
      wFetched++;
      try{ const w=await jp(Q_WALK,{ from:from, to:to }, req.signal); const tp=(w.trip.tripPatterns||[])[0];
        if(tp){ const pts=[]; (tp.legs||[]).forEach(function(l){ if(l.pointsOnLink&&l.pointsOnLink.points) pts.push.apply(pts,decodePolyline(l.pointsOnLink.points)); });
          state.walkCache.set(key,{ dur:tp.duration, dist:tp.streetDistance, pts:pts }); }
        else state.walkCache.set(key,null);
      // A failed walk (e.g. rate-limited) falls back to a crow-flies estimate; count them so a
      // material fraction can warn the user that verdicts may be approximate. Aborts don't count.
      }catch(e){ if(isAbort(e)) return; state.walkCache.set(key,null); wFail++; }
    }, CONFIG.limits.walkConcurrency);
    if(superseded(req)) return;
    state.walkFailRatio = wFetched ? wFail/wFetched : 0;
    // build interchanges with verdict + detour
    const xf=[];
    cand.forEach(function(p){ const wp=walkPair(p); const w=state.walkCache.get(wp.from+'>'+wp.to); if(w===undefined) return;
      const walkSec=w?w.dur:(p._euclid/CONFIG.defaults.walkSpeed), walkDist=w?w.dist:null;
      const pt=new Date(partnerTimeIso(p)).getTime(); const depT=partnerIsDep?pt:anchorT, arrT=partnerIsDep?anchorT:pt;
      const buf=(depT-arrT)/1000-walkSec;
      if(buf>maxWait) return;  // actual wait exceeds "Wait min" — too long to stand waiting for this one
      const cls=buf<0?'miss':(buf<CONFIG.connect.transferSlack?'warn':'ok');
      const pExp=partnerExpIso(p)?new Date(partnerExpIso(p)).getTime():null; let expBuf=null;
      if(pExp!=null&&anchorExp!=null){ const depE=partnerIsDep?pExp:anchorExp, arrE=partnerIsDep?anchorExp:pExp; expBuf=(depE-arrE)/1000-walkSec; }
      // straight-line must use OTP's snapped walk endpoints, not the quay coords
      let eu=p._euclid; if(w&&w.pts&&w.pts.length>=2){ const a0=w.pts[0],a1=w.pts[w.pts.length-1]; eu=haversine(a0[0],a0[1],a1[0],a1[1]); }
      const det=walkDist!=null?detour(eu,walkDist):{conf:0,excess:0,ratio:1};
      xf.push({ a:p, walkSec:walkSec, walkDist:walkDist, pts:w?w.pts:null, euclid:eu, buf:buf, expBuf:expBuf, cls:cls, detour:det,
        flagged:det.conf>=CONFIG.detour.flagAt, sameQuay:(wp.from===wp.to),
        // Timetable smell: two distinct journeys at the same quay within seconds of each other.
        bayClash:(wp.from===wp.to && Math.abs(buf)<CONFIG.smell.sameBaySec),
        arrTime: partnerIsDep?anchorTimeIso(anchor):partnerTimeIso(p),
        depTime: partnerIsDep?partnerTimeIso(p):anchorTimeIso(anchor),
        arrExp:  partnerIsDep?anchorExpIso(anchor):partnerExpIso(p),
        depExp:  partnerIsDep?partnerExpIso(p):anchorExpIso(anchor) }); });
    xf.sort(function(x,y){ const o={ok:0,warn:1,miss:2}; return (o[x.cls]-o[y.cls])||(x.buf-y.buf); });
    if(superseded(req)) return;
    state.interchanges=xf; renderInterchanges(); drawMap();
  }catch(e){ if(isAbort(e)||superseded(req)) return; $('xfScroll').innerHTML='<div class="hint err">'+esc(e.message)+'</div>'; }
  finally{ if(!superseded(req)) busy(false); }
}

function visibleXf(){ const self=state;
  const vis=state.interchanges.filter(function(x){
    if(self.modeHidden.has(modeIcon(x.a.mode))) return false;
    // Hide-semantics: a row drops if its verdict class is hidden, or (independently) if it's
    // flagged and the Flagged chip is hidden. All chips start ON (nothing hidden).
    if(self.connHidden.has(x.cls)) return false;
    if(x.flagged && self.connHidden.has('flag')) return false;
    if(self.lineQ){ const s=((x.a.lineNo||'')+' '+(x.a.lineName||'')+' '+(x.a.dest||'')+' '+(x.a.mode||'')).toLowerCase(); if(s.indexOf(self.lineQ)===-1) return false; }
    return true; });
  // 'chrono' (default): by the AIMED time shown BIG on the card (the one the user reads),
  //   real-time only breaking ties — so the prominent times run top-to-bottom in order.
  //   (Keying on the small real-time made the big times look unsorted: 14:15, 14:15, 14:14…)
  // 'buffer': by planned buffer ascending — the same idea, but adjusted for the walk time
  //   (departure − arrival − walk), so the tightest connection sorts first.
  const pDep=(DIR().partnerTime==='dep');
  const ms=function(iso){ const t=new Date(iso).getTime(); return isNaN(t)?Infinity:t; };  // missing time sorts last, never NaN
  const aim=function(x){ return ms(pDep?x.depTime:x.arrTime); };
  const live=function(x){ return ms(pDep?(x.depExp||x.depTime):(x.arrExp||x.arrTime)); };
  vis.sort(self.xfSort==='buffer'
    ? function(x,y){ return x.buf-y.buf; }
    : function(x,y){ return (aim(x)-aim(y))||(live(x)-live(y)); });
  return vis; }

function renderInterchanges(){
  const d=DIR(); const anchor=state.selAnchor; const partnerIsDep=(d.partnerTime==='dep'); const all=state.interchanges;
  const counts={ok:0,warn:0,miss:0,flag:0}; all.forEach(function(x){ counts[x.cls]++; if(x.flagged) counts.flag++; });
  const vis=visibleXf();
  $('xfCount').textContent=vis.length+' / '+all.length;
  // No anchor banner: the selected board item on the left (red-tinted) is the
  // context, and the only extra it held was the quay id — which lives in the detail.
  let html='<div class="tiles">'
    +'<div class="tile ok"><div class="n">'+counts.ok+'</div><div class="l">'+t('x.feasible')+'</div></div>'
    +'<div class="tile warn"><div class="n">'+counts.warn+'</div><div class="l">'+t('x.tight')+'</div></div>'
    +'<div class="tile miss"><div class="n">'+counts.miss+'</div><div class="l">'+t('x.missed')+'</div></div>'
    +'<div class="tile flag"><div class="n">'+counts.flag+'</div><div class="l">'+t('x.flagged')+'</div></div></div>';
  // mode filter
  const modesPresent=Array.from(new Set(all.map(function(x){return modeIcon(x.a.mode);})));
  html+='<div><div class="flt-lbl">'+t('x.mode')+'</div><div class="chips" id="modeChips">'
    +modesPresent.map(function(m){ return '<button class="chip" data-mode="'+m+'" aria-label="Show '+esc(m)+' connections"'+(state.modeHidden.has(m)?' aria-pressed="false"':' aria-pressed="true"')+'><svg><use href="#ic-'+m+'"/></svg>'+m+'</button>'; }).join('')+'</div></div>';
  html+='<div class="filterbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="lineFilter" aria-label="Filter connections by line" placeholder="filter to a line…" value="'+attr(state.lineQ)+'"/></div>';
  const cchip=function(cls,key,label){ return '<button class="chip '+cls+'" data-c="'+key+'" aria-label="Show '+label.replace(/⚑ /,'')+' connections" aria-pressed="'+(!state.connHidden.has(key))+'">'+label+'</button>'; };
  html+='<div><div class="flt-lbl">'+t('x.connection')+'</div><div class="chips" id="connChips">'
    +cchip('ok','ok',t('x.feasible'))+cchip('warn','warn',t('x.tight'))+cchip('miss','miss',t('x.missed'))+cchip('','flag','⚑ '+t('x.flagged'))+'</div></div>';
  html+='<div><div class="flt-lbl">'+t('x.sort')+'</div><div class="dirseg" id="xfSortSeg" role="group" aria-label="Sort connections">'
    +'<button data-s="chrono" aria-pressed="'+(state.xfSort!=='buffer')+'"'+(state.xfSort!=='buffer'?' class="on"':'')+'>'+t('x.sortchrono')+'</button>'
    +'<button data-s="buffer" aria-pressed="'+(state.xfSort==='buffer')+'"'+(state.xfSort==='buffer'?' class="on"':'')+'>'+t('x.sortbuffer')+'</button></div></div>';

  const notes=[];
  if(state.walkFailRatio>=CONFIG.limits.walkFailWarn) notes.push('Some walk times couldn’t be fetched (possibly rate-limited) — affected verdicts fall back to a straight-line estimate.');
  if(state.partnerTruncated) notes.push('Some neighbour stops hit the '+CONFIG.limits.partnerCap+'-service ceiling — narrow the time span for completeness.');
  if(notes.length) html+='<div class="hint" style="text-align:left;padding:6px 2px;font-size:11px;color:var(--c-warn)">⚠ '+esc(notes.join(' '))+'</div>';
  if(!vis.length) html+='<div class="hint">'+t('x.none')+'</div>';
  html+='<div id="xfCards" style="display:flex;flex-direction:column;gap:9px">';
  const anchorClk=clock(anchorTimeIso(anchor));
  vis.slice(0,state.renderN).forEach(function(x,i){ const a=x.a;
    const wd=x.walkDist!=null?(Math.round(x.walkSec/60)+':'+pad(Math.round(x.walkSec%60))+' · '+Math.round(x.walkDist)+' m'):'≈'+Math.round(x.euclid)+' m';
    // Same card grammar as the board; the partner's aimed/live time leads.
    const pAim=partnerIsDep?x.depTime:x.arrTime, pLive=partnerIsDep?x.depExp:x.arrExp;
    // Always show the stop name here, so a same-stop connection doesn't read as a
    // mysteriously blank line — evenness beats saving one repeated word.
    const stopName=a.stopName||state.stop.name||null;
    // relational only (no success verb — it must read right on impossible ones too)
    const roleNote=partnerIsDep?('from your '+anchorClk):('to your '+anchorClk);
    const guar=(x.guaranteed&&typeof x.guaranteed==='object')?x.guaranteed:null;
    const gl=guarLevel(x.guaranteed);
    html+='<button type="button" class="xf '+x.cls+(gl==='weak'?' guarweak':(gl?' guar':''))+'" data-k="'+state.interchanges.indexOf(x)+'"'+(state.selXf===x?' aria-selected="true"':'')+'>'
      +svcHead(a, pAim, pLive, stopName, roleNote)
      +'<div class="xf-meta">'+(x.sameQuay?'<span class="pill">⏱ '+t('x.waitquay')+'</span>':'<span class="pill">🚶 '+wd+'</span>')

      +(x.expBuf!=null?'<span class="pill" style="opacity:.7"><span class="k">live</span><span class="buf '+(x.expBuf<0?'neg':x.expBuf<CONFIG.connect.transferSlack?'tt':'pos')+'">'+signed(x.expBuf)+'</span></span>':'')
      +(gl==='weak'?'<span class="pill flagpill guarpill weak">⚠ '+(guar.maxWait==null?'guarantee · no wait time':'guarantee · won’t wait')+'</span>'
        : guar?'<span class="pill flagpill guarpill">⛨ '+(guar.staySeated?'Stay-seated':'Guaranteed'+(guar.maxWait?' ·'+Math.round(guar.maxWait/60)+'m':''))+'</span>':'')
      +(x.guaranteed==='checking'?'<span class="pill">⛨ checking…</span>':'')

      +(x.bayClash?'<span class="pill flagpill">⚠ same bay</span>':'')
      +'</div></button>';

  $('modeChips').addEventListener('click',function(e){ const c=e.target.closest('.chip'); if(!c)return; const m=c.dataset.mode;
    state.modeHidden.has(m)?state.modeHidden.delete(m):state.modeHidden.add(m); renderInterchanges(); drawMap(); });
  $('xfSortSeg').addEventListener('click',function(e){ const b=e.target.closest('button'); if(!b)return;
    state.xfSort=b.dataset.s; localStorage.setItem('ie-xfsort',state.xfSort); renderInterchanges(); });
  $('connChips').addEventListener('click',function(e){ const c=e.target.closest('.chip'); if(!c)return; const k=c.dataset.c;
    state.connHidden.has(k)?state.connHidden.delete(k):state.connHidden.add(k); renderInterchanges(); drawMap(); });
  const lf=$('lineFilter'); lf.addEventListener('input',debounce(function(){ state.lineQ=lf.value.toLowerCase(); const p=lf.selectionStart; renderInterchanges(); drawMap(); const n=$('lineFilter'); n.focus(); try{n.setSelectionRange(p,p);}catch(_){} },180));
  if($('moreBtn')) $('moreBtn').addEventListener('click',function(){ state.renderN+=CONFIG.limits.renderCap; renderInterchanges(); });
  $('xfScroll').querySelectorAll('.xf').forEach(function(el){ el.addEventListener('click',function(){ selectXf(state.interchanges[+el.dataset.k]); }); });
}

/* ============================ step 3: detail ============================== */
function selectXf(x){ state.selXf=x;
  document.querySelectorAll('.xf').forEach(function(el){ el.setAttribute('aria-selected', state.interchanges[+el.dataset.k]===x?'true':'false'); });
  renderDetail(x); drawMap(); if(x.a.lat) mapApi_pan([x.a.lat,x.a.lon]);
  // On-inspection guaranteed-interchange check: only the failing-but-plausible band,
  // only once per card (cached), only when the user opens it. One extra call.
  if(x.guaranteed===undefined && inGuarBand(x)){
    x.guaranteed='checking'; renderDetail(x);
    resolveGuaranteed(x).then(function(){ if(state.selXf===x) renderDetail(x); renderInterchanges(); drawMap(); });
  }
}
// A guarantee can hold a departure a few minutes, not half an hour — so only probe
// buffers that fail the 2-min minimum but by less than bandMin.
function inGuarBand(x){ return x.buf < CONFIG.connect.transferSlack && x.buf > -(CONFIG.guaranteed.bandMin*60); }
// A guarantee only functions if the departure actually holds: stay-seated (same vehicle),
// or a real maximum wait (≥ 1 min). A 0 / sub-minute / MISSING maxWait is a non-functional
// guarantee — it waives the planner's 2-min padding but the vehicle won't wait, so a late
// arrival still misses. That must read as a caution (amber), never a confident green ⛨.
// Returns 'stay' | 'full' | 'weak' | null.
function guarLevel(g){ if(!g||typeof g!=='object') return null;
  if(g.staySeated) return 'stay';
  if(g.maxWait!=null && g.maxWait>=60) return 'full';
  return 'weak'; }
// Provoke a line-whitelisted trip through this exact transfer and read the interchange
// object off the leg. Sets x.guaranteed = {guaranteed,staySeated,maxWait} or null.
async function resolveGuaranteed(x){
  const partnerIsDep=(DIR().partnerTime==='dep'), anchor=state.selAnchor;
  const arrivalSvc=partnerIsDep?anchor:x.a, departSvc=partnerIsDep?x.a:anchor;
  if(!arrivalSvc.sjId||!departSvc.sjId||!arrivalSvc.lineId||!departSvc.lineId){ x.guaranteed=null; return; }
  const date=(x.arrTime||'').slice(0,10); if(!date){ x.guaranteed=null; return; }
  const sig=state.mainAbort&&state.mainAbort.signal;  // a new anchor selection cancels a pending probe
  try{
    // 1. both journeys' calls, to pin the exact run (stop just before / after the transfer)
    const q='query($a:String!,$b:String!,$date:Date!){ a:serviceJourney(id:$a){ estimatedCalls(date:$date){ quay{id} aimedDepartureTime } }'
           +' b:serviceJourney(id:$b){ estimatedCalls(date:$date){ quay{id} } } }';
    const sc=await jp(q,{ a:arrivalSvc.sjId, b:departSvc.sjId, date:date }, sig);
    const aC=(sc.a&&sc.a.estimatedCalls)||[], dC=(sc.b&&sc.b.estimatedCalls)||[];
    let ai=aC.findIndex(function(c){return c.quay&&c.quay.id===arrivalSvc.quayId;}); if(ai<0) ai=aC.length-1;
    const before=aC[Math.max(0,ai-1)]; if(!before||!before.aimedDepartureTime){ x.guaranteed=null; return; }
    let di=dC.findIndex(function(c){return c.quay&&c.quay.id===departSvc.quayId;}); if(di<0) di=0;
    const after=dC[Math.min(dC.length-1,di+1)]||dC[dC.length-1]; if(!after||!after.quay){ x.guaranteed=null; return; }
    // 2. whitelist the two lines so OTP can only build this transfer, and read the interchange
    const tq='query($from:String!,$to:String!,$dt:DateTime!,$lines:[ID!]!){'
      +' trip(from:{place:$from},to:{place:$to},dateTime:$dt,searchWindow:'+CONFIG.guaranteed.searchWindow+',numTripPatterns:4,'
      +'filters:[{select:[{lines:$lines}]}]){ tripPatterns{ legs{ line{id} interchangeTo{ guaranteed staySeated maximumWaitTime } } } } }';
    const tr=await jp(tq,{ from:before.quay.id, to:after.quay.id, dt:before.aimedDepartureTime, lines:[arrivalSvc.lineId, departSvc.lineId] }, sig);
    let found=null;
    (tr.trip.tripPatterns||[]).forEach(function(p){ if(found) return;
      (p.legs||[]).forEach(function(l){ if(found) return; const it=l.interchangeTo;
        if(it && (it.guaranteed||it.staySeated) && l.line && l.line.id===arrivalSvc.lineId)
          found={ guaranteed:!!it.guaranteed, staySeated:!!it.staySeated, maxWait:it.maximumWaitTime }; }); });
    x.guaranteed=found;
  }catch(e){ x.guaranteed = isAbort(e)?undefined:null; }
}
function renderDetail(x){
  const partnerIsDep=(DIR().partnerTime==='dep'); const anchor=state.selAnchor;
  const arrivalSvc = partnerIsDep ? anchor : x.a;   // the service you get OFF
  const departSvc  = partnerIsDep ? x.a : anchor;   // the service you get ON
  const arrIsAnchor=(arrivalSvc===anchor), depIsAnchor=(departSvc===anchor);
  const stopOf=function(svc,isA){ return isA?{id:state.stop.id,name:state.stop.name}:{id:svc.stopId,name:svc.stopName}; };
  const guar=(x.guaranteed&&typeof x.guaranteed==='object')?x.guaranteed:null;
  const gl=guarLevel(x.guaranteed);
  let vcls, vtext;
  if(gl==='stay'){ vcls='guar'; vtext='⛨ Stay-seated — the same vehicle continues; no change needed.';
  } else if(gl==='full'){ vcls='guar'; vtext='⛨ Guaranteed — the departure holds up to '+Math.round(guar.maxWait/60)+' min for the arrival.';
  } else if(gl==='weak'){ vcls='warn';
    vtext = (guar.maxWait==null)
      ? '⚠ Guaranteed, but no maximum wait time is published — the departure may not hold for the arrival, so this connection is unreliable.'
      : '⚠ Guaranteed, but the departure holds 0 min — it waives the 2-minute transfer minimum, so the connection works only when the arrival is on time; it will not wait for a late arrival.';
  } else if(x.guaranteed==='checking'){ vcls='checking'; vtext='Checking for a guaranteed interchange…';
  } else { vcls=x.flagged?'flag':x.cls;
    vtext=x.flagged?('⚑ Long walk — '+Math.round(x.detour.excess)+' m beyond the straight line')
     :(x.cls==='miss'?'Impossible — the arrival lands after the departure, unless a guaranteed interchange holds it.'
      :x.cls==='warn'?'Missed — under Entur’s 2-min transfer minimum, so the planner won’t offer it, unless it’s a guaranteed interchange.'
      :'Possible — clears the 2-min transfer minimum.'); }
  // Walk duration spelled out in full ("8 minutes 6 seconds") — "s"/"m"/"min" confuse; bold to lead the eye.
  const wd=x.walkDist!=null?('<b>'+humanDur(x.walkSec)+'</b> · '+Math.round(x.walkDist)+' meters'):'≈ '+Math.round(x.euclid)+' meters · <b>'+humanDur(x.walkSec)+'</b> (no path)';
  const ratioLabel = x.walkDist==null ? '' : (x.euclid<CONFIG.detour.minEuclid ? ' · adjacent'
    : x.detour.ratio<1.1 ? ' · direct' : ' · ×'+x.detour.ratio.toFixed(1));
  // The walk is a real leg: after alighting (arr) and walking, the passenger REACHES the
  // departing quay at this time — which is what the buffer measures against the departure.
  const reachIso = x.arrTime ? new Date(new Date(x.arrTime).getTime()+(x.walkSec||0)*1000).toISOString() : null;
  // Same card grammar as the board/cards, plus the raw ids.
  const legHtml=function(svc,aimIso,liveIso,role,isA){ const so=stopOf(svc,isA);
    return '<div class="dleg">'+svcHead(svc, aimIso, liveIso, so.name, null, role)
      +'<div class="idrow"><b>StopPlace</b> '+esc(so.id||'?')+'</div>'
      +'<div class="idrow"><b>Quay</b> '+esc(svc.quayId||'?')+'</div>'
      +'<div class="idrow"><b>Line</b> '+esc(svc.lineId||'?')+'</div>'
      +'<div class="idrow"><b>ServiceJourney</b> '+esc(svc.sjId||'?')+'</div></div>'; };
  const el=$('detail'); const wasHidden=el.classList.contains('hidden'); el.classList.remove('hidden');
  el.innerHTML='<div class="detail-head"><span class="ttl">'+t('d.detail')+'</span><button class="x" id="detailX" aria-label="Close detail" title="Close">✕</button></div>'
    +'<div class="detail-body">'
    +legHtml(arrivalSvc, x.arrTime, x.arrExp, 'arrives', arrIsAnchor)
    +(x.sameQuay
       ? '<div class="walkrow'+(x.bayClash?' clash':'')+'"><div class="wr-main">⏱ <span>'+t('x.waitquay')+'</span><span class="r">same platform</span></div>'
         +(x.bayClash?'<div class="wr-reach">⚠ <b>same bay at '+clock(x.arrTime)+'</b> — two vehicles share this quay at the same time (fine only if it holds two)</div>':'')+'</div>'
       : '<div class="walkrow"><div class="wr-main">🚶 <span>'+wd+'</span>'+(x.flagged?'<span class="r">vs '+Math.round(x.euclid)+' meters straight'+ratioLabel+'</span>':'')+'</div>'
         +(reachIso?'<div class="wr-reach">↳ reach the departing quay at <b>'+clock(reachIso)+'</b> (arrive '+clock(x.arrTime)+' + walk)</div>':'')+'</div>')
    +legHtml(departSvc, x.depTime, x.depExp, 'departs', depIsAnchor)
    +'<div class="bufbig"><div class="bufbox"><div class="k">Planned buffer</div><div class="v buf '+(x.cls==='ok'?'pos':x.cls==='warn'?'tt':'neg')+'">'+signed(x.buf)+'</div></div>'
      +'<div class="bufbox secondary"><div class="k">Live buffer</div><div class="v buf '+(x.expBuf==null?'neg':x.expBuf<0?'neg':x.expBuf<CONFIG.connect.transferSlack?'tt':'pos')+'">'+(x.expBuf==null?'–':signed(x.expBuf))+'</div></div></div>'
    +'<div class="tmin">Transfer minimum <b>'+mmss(CONFIG.connect.transferSlack)+'</b> — a connection needs at least this much spare on top of the walk (≈1 min to alight + 1 min to board).</div>'
    +'<div class="verdict '+vcls+'">'+vtext+'</div>'
    +'</div>';
  $('detailX').addEventListener('click',hideDetail);
  el.onkeydown=function(e){ if(e.key==='Escape'){ e.preventDefault(); hideDetail(); } };
  if(wasHidden) el.focus();  // move focus in on open, but not on in-place re-renders (e.g. probe result)
}
function hideDetail(){ const card=document.querySelector('.xf[aria-selected="true"]');
  $('detail').classList.add('hidden'); if(state.selXf){ state.selXf=null;
  document.querySelectorAll('.xf[aria-selected="true"]').forEach(function(el){el.setAttribute('aria-selected','false');}); drawMap(); }
  if(card) card.focus();  // return focus to the card that opened the panel
}

/* ============================ map drawing ================================= */
let mapLayer=null;
function pinIcon(mode,kind){ const cls='pin-ic '+(kind||''); const size=kind==='anchor'?36:30; const isz=Math.round(size*0.55);
  // The svg needs an explicit viewBox + size, or <use> of a 24-unit symbol renders tiny.
  return L.divIcon({ className:'', iconSize:[size,size], iconAnchor:[size/2,size/2],
    html:'<div class="'+cls+'" style="width:'+size+'px;height:'+size+'px"><svg width="'+isz+'" height="'+isz+'" viewBox="0 0 24 24"><use href="#ic-'+modeIcon(mode)+'"/></svg></div>' }); }
function focusMap(coords){ const pts=coords.filter(Boolean); if(!pts.length)return;
  if(pts.length===1) mapApi.map.setView(pts[0],15); else mapApi.map.fitBounds(pts,{padding:[50,50]}); }
function mapApi_pan(c){ mapApi.map.panTo(c,{animate:true}); }
function walkColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--c-walk').trim(); }
function drawMap(){
  if(mapLayer) mapApi.map.removeLayer(mapLayer); mapLayer=L.layerGroup().addTo(mapApi.map);
  const anchor=state.selAnchor;
  if(!anchor){ if(state.stop&&state.stop.coord){ L.marker(state.stop.coord,{icon:pinIcon('other','anchor')}).addTo(mapLayer); } $('legend').style.display='none'; return; }
  $('legend').style.display='';
  const aQuay=(state.stop.quays||[]).find(function(q){return q.id===anchor.quayId;});
  const dc = aQuay?[aQuay.latitude,aQuay.longitude]:state.stop.coord;
  const vis=visibleXf(); const col=walkColor();
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--c-accent').trim();  // Coral #ff5959
  const bounds=[dc];
  vis.forEach(function(x){ if(!x.a.lat)return; const ac=[x.a.lat,x.a.lon]; bounds.push(ac);
    const isSel=state.selXf===x, hasSel=!!state.selXf;
    // Selected walk stands out by COLOUR (Coral, matching the selected quay pins), so it
    // need not be much thicker; once something is selected the other (blue) links recede.
    const lc = isSel?acc:col;
    const wReal = isSel?4.5:(hasSel?2:3.2), wDash = isSel?4:(hasSel?1.6:2.6), op = isSel?1:(hasSel?0.32:0.62);
    if(x.pts&&x.pts.length>1){ L.polyline(x.pts,{color:lc,weight:wReal,opacity:op}).addTo(mapLayer); }
    else { L.polyline([ac,dc],{color:lc,weight:wDash,opacity:op,dashArray:'2 6'}).addTo(mapLayer); }
    if(x.flagged){ L.polyline([ac,dc],{color:getComputedStyle(document.documentElement).getPropertyValue('--c-faint').trim(),weight:1.4,opacity:0.8,dashArray:'2 6'}).addTo(mapLayer); }
    const m=L.marker(ac,{icon:pinIcon(x.a.mode,isSel?'sel':'')}).addTo(mapLayer)
      .bindTooltip(esc((x.a.lineNo||x.a.mode||''))+' · '+clock(partnerTimeIso(x.a)),{direction:'top',offset:[0,-8]});  // esc: Leaflet sets tooltip innerHTML
    m.on('click',function(){ selectXf(x); });
  });
  L.marker(dc,{icon:pinIcon(anchor.mode,'anchor')}).addTo(mapLayer).bindTooltip(esc(anchor.lineNo||'')+' · '+clock(anchorTimeIso(anchor)),{direction:'top',offset:[0,-8]});
  // Fit the view only when the anchor changed — not on every chip toggle (that re-zoomed jarringly).
  if(bounds.length>1 && !state.selXf && state._fitAnchor!==anchor){ mapApi.map.fitBounds(bounds,{padding:[60,60],maxZoom:16}); state._fitAnchor=anchor; }
}

/* ============================ chrome ====================================== */
function busy(on,msg){ $('busy').classList.toggle('on',on); if(msg)$('busyMsg').textContent=msg; }

/* stop search */
const stopInput=$('stopInput'); const geoList=$('geoList'); let geoResults=[], geoActive=-1, geoAbort=null;
function geoOpen(open){ geoList.classList.toggle('hidden',!open); stopInput.setAttribute('aria-expanded',open?'true':'false');
  if(!open){ geoActive=-1; stopInput.removeAttribute('aria-activedescendant'); } }
function paintGeoActive(){ Array.from(geoList.querySelectorAll('.geo-item')).forEach(function(el,i){ const on=i===geoActive; el.classList.toggle('active',on); el.setAttribute('aria-selected',on?'true':'false'); });
  if(geoActive>=0){ stopInput.setAttribute('aria-activedescendant','geo-'+geoActive); const el=geoList.children[geoActive]; if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  else stopInput.removeAttribute('aria-activedescendant'); }
function chooseGeo(i){ const r=geoResults[i]; if(!r||!r.id) return; stopInput.value=r.name; geoOpen(false); loadStop({id:r.id,name:r.name}); }
stopInput.addEventListener('input',debounce(async function(){ const q=stopInput.value.trim();
  if(q.length<2){ geoOpen(false); return; }
  if(geoAbort) geoAbort.abort(); geoAbort=new AbortController();  // its own controller — typing must not cancel a board load
  try{ geoResults=await geoAutocomplete(q,geoAbort.signal);
    geoList.innerHTML=geoResults.map(function(r,i){ return '<div class="geo-item" id="geo-'+i+'" role="option" aria-selected="false" data-i="'+i+'"><span class="n">'+esc(r.name)+'</span><span class="m">'+esc(r.id)+(r.locality?' · '+esc(r.locality):'')+'</span></div>'; }).join('')
      || '<div class="geo-item" role="option" aria-disabled="true"><span class="m">no matches</span></div>';
    geoActive=-1; geoOpen(true);
  }catch(e){ if(e.name==='AbortError') return; geoList.innerHTML='<div class="geo-item"><span class="m">'+esc(e.message)+'</span></div>'; geoOpen(true); }
},250));
stopInput.addEventListener('keydown',function(e){ const n=geoResults.length; if(geoList.classList.contains('hidden')||!n) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); geoActive=(geoActive+1)%n; paintGeoActive(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); geoActive=(geoActive-1+n)%n; paintGeoActive(); }
  else if(e.key==='Enter'&&geoActive>=0){ e.preventDefault(); chooseGeo(geoActive); }
  else if(e.key==='Escape'){ geoOpen(false); } });
geoList.addEventListener('click',function(e){ const it=e.target.closest('.geo-item'); if(!it||it.dataset.i===undefined)return; chooseGeo(+it.dataset.i); });
document.addEventListener('click',function(e){ if(!e.target.closest('.stopbox')) geoOpen(false); });

// The time span reloads the board (To clamped ≥ From); walk/wait only change the connection

// theme + lang
(function(){ dark=localStorage.getItem('ie-theme')==='dark'; applyTheme(dark);
  $('theme').setAttribute('aria-pressed',dark?'true':'false');
  $('theme').addEventListener('click',function(){ dark=!dark; applyTheme(dark); mapApi.setVariant(dark); localStorage.setItem('ie-theme',dark?'dark':'light'); $('theme').setAttribute('aria-pressed',dark?'true':'false'); });
})();
$('lang').textContent=LANG.toUpperCase();
$('lang').addEventListener('click',function(){ LANG=LANG==='en'?'no':'en'; localStorage.setItem('ie-lang',LANG); $('lang').textContent=LANG.toUpperCase(); applyI18n();
  if(state.selAnchor) renderInterchanges(); else if(state.stop) renderBoard(); });

// background select
(function(){ const s=$('mapBg'); Object.keys(BG).forEach(function(n){ const o=document.createElement('option'); o.value=n; o.textContent=n; s.appendChild(o); }); })();

/* ============================ boot ======================================== */
applyI18n(); initQuery(); paintDirTabs();
mapApi=createMap(); mapApi.setVariant(dark);
if(/[?&]debug\b/.test(location.search)) window.__ie={ state:state, CONFIG:CONFIG };   // debug hook, opt-in via ?debug
})();
</script>
